<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>한글 서체 비교 | careCL GRID</title>
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400&family=Gowun+Dodum&family=Noto+Serif+KR:wght@300;400&display=swap">
<style>
@font-face{font-family:"Caviar Dreams";src:url(fonts/caviar-dreams.woff2) format("woff2");font-weight:400}
:root{--ink:#1E1A17;--ink-2:#6B625C;--accent:#E0662B;--hair:rgba(30,26,23,.12)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased}
header{padding:48px 6vw 24px}
header h1{margin:0;font-family:"Caviar Dreams";font-weight:400;font-size:40px}
header p{margin:10px 0 0;color:var(--ink-2);font-size:15px}
.row{display:grid;grid-template-columns:240px 1fr;gap:40px;padding:48px 6vw;border-top:1px solid var(--hair)}
.meta b{display:block;font-size:20px;font-weight:600}
.meta span{display:block;margin-top:6px;font-size:13px;color:var(--ink-2);line-height:1.6}
.meta em{display:inline-block;margin-top:10px;font-style:normal;font-size:12px;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px}
.s .lab{margin:0;font-family:"Caviar Dreams";font-size:12px;letter-spacing:.2em;color:var(--accent)}
.s .en{margin:.3em 0 0;font-family:"Caviar Dreams";font-size:56px;line-height:1.05}
.s .kr{margin:.5em 0 0;font-size:17px;color:var(--ink-2)}
.s .h{margin:1.4em 0 0;font-size:44px;line-height:1.3;letter-spacing:-.01em}
.s .h .c{font-family:"Caviar Dreams"}
.s .p{margin:1em 0 0;max-width:46em;font-size:16px;line-height:1.85;color:#4a423c}
@media (max-width:760px){.row{grid-template-columns:1fr;gap:18px}.s .en{font-size:40px}.s .h{font-size:30px}}
</style>
</head>
<body>
<header>
  <h1>Korean Typeface</h1>
  <p>로고 서체 Caviar Dreams와 함께 놓았을 때의 한글 서체 비교 — 모두 상업적 이용 무료 · 웹폰트</p>
</header>

<script>
var FONTS = [
  ["나눔스퀘어라운드", "\"NanumSquareRound\"", 400, "현재 적용. 둥글고 반듯한 기하형 — 로고와 모양은 비슷하지만 다소 귀여운 인상", "현재"],
  ["마루부리 Light", "\"MaruBuriLight\"", 400, "네이버 명조. 획이 가늘고 우아함 — 뷰티·럭셔리 브랜드 느낌이 가장 강함", "추천"],
  ["Noto Serif KR Light", "\"Noto Serif KR\"", 300, "구글 명조. 마루부리보다 단정하고 클래식", ""],
  ["IBM Plex Sans KR Light", "\"IBM Plex Sans KR\"", 300, "얇고 모던한 고딕 — 기술·클리닉 느낌의 정돈된 인상", "추천"],
  ["Pretendard Light", "\"Pretendard\"", 300, "가장 표준적인 고딕을 얇게 — 깔끔하고 무난", ""],
  ["고운돋움", "\"Gowun Dodum\"", 400, "부드럽고 손맛 있는 돋움 — 따뜻하고 여성스러운 인상", ""]
];
FONTS.forEach(function (f) {
  document.write('<section class="row"><div class="meta"><b>' + f[0] + '</b><span>' + f[3] + '</span>' + (f[4] ? '<em>' + f[4] + '</em>' : '') + '</div>' +
    '<div class="s" style="font-family:' + f[1].replace(/"/g, '&quot;') + ',sans-serif;font-weight:' + f[2] + '">' +
    '<p class="lab">Company</p><p class="en">Awards &amp; Certification</p><p class="kr">수상 · 인증</p>' +
    '<p class="h">사람마다 나이 드는<br>방식은 다릅니다. <span class="c">careCL</span></p>' +
    '<p class="p">같은 나이라도 얼굴에 노화가 나타나는 방식은 저마다 다릅니다. 케어클은 주름보다 먼저 나이 드는 방식을 읽고, 22개 부위 중 먼저 관리할 곳부터 제안합니다.</p>' +
    '</div></section>');
});
</script>
</body>
</html>
