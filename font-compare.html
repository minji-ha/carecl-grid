<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>한글 고딕 서체 비교 | careCL GRID</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/static/split/WantedSans.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400&family=Gothic+A1:wght@300;400&display=swap">
<style>
/* 사이트와 같게: 로고 서체 Caviar Dreams는 영문 글자에만 — &와 숫자는 한글 서체로 */
@font-face{font-family:"Caviar Dreams";src:url(fonts/caviar-dreams.woff2) format("woff2");font-weight:400;unicode-range:U+0000-0025,U+0027-002F,U+003A-FFFF}
@font-face{font-family:"Paperlogy";font-weight:300;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2) format("woff2")}
@font-face{font-family:"LINE Seed KR";font-weight:300;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/LINESeedKR-Th.woff2) format("woff2")}
:root{--ink:#1E1A17;--ink-2:#6B625C;--accent:#E0662B;--hair:rgba(30,26,23,.12)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased}
header{padding:48px 6vw 24px}
header h1{margin:0;font-family:"Caviar Dreams";font-weight:400;font-size:40px}
header p{margin:10px 0 0;color:var(--ink-2);font-size:15px;line-height:1.7}
.row{display:grid;grid-template-columns:240px 1fr;gap:40px;padding:48px 6vw;border-top:1px solid var(--hair)}
.meta b{display:block;font-size:20px;font-weight:600}
.meta span{display:block;margin-top:6px;font-size:13px;color:var(--ink-2);line-height:1.6}
.meta em{display:inline-block;margin-top:10px;margin-right:4px;font-style:normal;font-size:12px;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px}
.s .lab{margin:0;font-size:12px;letter-spacing:.2em;color:var(--accent)}
.s .en{margin:.3em 0 0;font-size:56px;line-height:1.05}
.s .kr{margin:.5em 0 0;font-size:17px;color:var(--ink-2)}
.s .h{margin:1.2em 0 0;font-size:44px;line-height:1.3;letter-spacing:-.01em}
.s .num{margin:.8em 0 0;font-size:24px;letter-spacing:-.01em}
.s .num i{font-style:normal;color:var(--accent)}
.s .p{margin:1em 0 0;max-width:46em;font-size:16px;line-height:1.85;color:#4a423c}
@media (max-width:760px){.row{grid-template-columns:1fr;gap:18px}.s .en{font-size:40px}.s .h{font-size:30px}.s .num{font-size:19px}}
</style>
</head>
<body>
<header>
  <h1>Korean Gothic</h1>
  <p>세련된 고딕 계열 한글 서체 비교 — 모두 상업적 이용 무료 · 웹폰트<br>
  사이트와 같이 영문 글자만 로고 서체(Caviar Dreams), <b>숫자와 &amp;는 한글 서체</b>로 보여줍니다.</p>
</header>

<script>
var FONTS = [
  ["IBM Plex Sans KR Light", "\"IBM Plex Sans KR\"", 300, "현재 적용. 얇고 기계적인 모던 고딕 — 정돈된 클리닉 느낌", ["현재", "SIL OFL"]],
  ["Wanted Sans", "\"Wanted Sans Variable\",\"Wanted Sans\"", 300, "원티드 서체. 숫자·영문이 특히 세련됨 — 요즘 브랜드 사이트에서 가장 고급스럽게 쓰이는 고딕", ["추천", "SIL OFL"]],
  ["Pretendard Light", "\"Pretendard\"", 300, "가장 표준적인 고딕을 얇게 — 깔끔하고 무난, 숫자 정렬이 좋음", ["SIL OFL"]],
  ["SUIT Light", "\"SUIT\"", 300, "Pretendard보다 글자가 살짝 좁고 단단함 — 모던하고 차분", ["추천", "SIL OFL"]],
  ["Gothic A1 Light", "\"Gothic A1\"", 300, "구글 고딕. 획이 가늘고 공간이 넓음 — 잡지 같은 고급스러운 인상", ["SIL OFL"]],
  ["LINE Seed KR Thin", "\"LINE Seed KR\"", 300, "라인 서체. 둥글고 친근한 기하형 — 숫자 모양이 로고와 비슷", ["무료 상업용"]],
  ["Paperlogy Light", "\"Paperlogy\"", 300, "기하학적이고 반듯함 — 깔끔하지만 개성 있는 제목용", ["SIL OFL"]],
  ["Spoqa Han Sans Neo Light", "\"Spoqa Han Sans Neo\"", 300, "스포카 서체. 숫자·영문이 한글과 잘 섞임 — 정보 전달형", ["SIL OFL"]]
];
FONTS.forEach(function (f) {
  document.write('<section class="row"><div class="meta"><b>' + f[0] + '</b><span>' + f[3] + '</span>' + f[4].map(function (t) { return '<em>' + t + '</em>'; }).join('') + '</div>' +
    '<div class="s" style="font-family:&quot;Caviar Dreams&quot;,' + f[1].replace(/"/g, '&quot;') + ',sans-serif;font-weight:' + f[2] + '">' +
    '<p class="lab">Company</p><p class="en">Awards &amp; Certification</p><p class="kr">수상 · 인증</p>' +
    '<p class="h">사람마다 나이 드는<br>방식은 다릅니다.</p>' +
    '<p class="num"><i>01</i> Notice · 22개 부위 · 한 칸에 5초 · 17년의 클리닉 경험 · 2026</p>' +
    '<p class="p">같은 나이라도 얼굴에 노화가 나타나는 방식은 저마다 다릅니다. 케어클은 주름보다 먼저 나이 드는 방식을 읽고, 22개 부위 중 먼저 관리할 곳부터 제안합니다.</p>' +
    '</div></section>');
});
</script>
</body>
</html>
